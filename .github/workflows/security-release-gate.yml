name: Güvenlik ve release kapısı

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  technical-gate:
    name: Teknik güvenlik kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: pnpm kur
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Node.js kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Bağımlılıkları kilit dosyasından kur
        run: pnpm install --frozen-lockfile

      - name: Yerel Supabase ortamını başlat
        run: pnpm supabase:start

      - name: Güvenli yerel ortamı hazırla
        run: |
          pnpm supabase:env
          pnpm pii:local-keys

      - name: Teknik release kapısını doğrula
        run: pnpm release:verify

      - name: Yerel Supabase ortamını durdur
        if: always()
        run: pnpm supabase:stop

  live-pii-gate:
    name: Canlı PII kanıt kapısı
    if: github.event_name == 'workflow_dispatch'
    needs: technical-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: pnpm kur
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Node.js kur
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Canlı PII kanıtlarını doğrula
        run: pnpm release:assert-live-pii
