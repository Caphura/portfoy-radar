<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <meta content="#185d45" name="theme-color" />
    <meta content="noindex, nofollow" name="robots" />
    <title>Çevrimdışı · Portföy Radar</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3f5ef;
        color: #152a21;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        padding:
          max(1rem, env(safe-area-inset-top))
          1rem
          max(1rem, env(safe-area-inset-bottom));
        place-items: center;
        background:
          radial-gradient(circle at 85% 6%, rgba(72, 164, 119, 0.14), transparent 27rem),
          #f3f5ef;
      }

      main {
        width: min(100%, 28rem);
        padding: 1.5rem;
        border: 1px solid #dce3dc;
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(18, 37, 29, 0.12);
      }

      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1.25rem;
      }

      p {
        margin: 1rem 0 0;
        color: #65756d;
        font-size: 0.925rem;
        line-height: 1.6;
      }

      h1 {
        margin: 1.5rem 0 0;
        font-size: clamp(2rem, 10vw, 2.75rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        margin-top: 1.5rem;
        padding: 0.75rem 1.1rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: #185d45;
        color: white;
        font-size: 0.875rem;
        font-weight: 800;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #185d45;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img alt="" height="64" src="/icons/icon-192x192.png" width="64" />
      <h1>Bağlantı bekleniyor</h1>
      <p>
        Portföy ve iletişim verileri güvenlik nedeniyle bu cihazda çevrimdışı
        saklanmaz. İnternet bağlantınızı kontrol edip yeniden deneyin.
      </p>
      <a href="/">Bağlantıyı yeniden dene</a>
    </main>
  </body>
</html>
